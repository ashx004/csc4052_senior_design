name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json is committed (it's gitignored), so `npm ci`
      # isn't usable here — falls back to `npm install`.
      - run: npm install

      - run: npm run typecheck

      - run: npm test
