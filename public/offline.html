<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalyst - offline</title>
  <style>
    :root { --bg: #FAFAF8; --text: #1f2328; --muted: #6b6f76; --primary: #b08957; --primary-hover: #9c7849; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --text: #ececec; --muted: #a0a4ab; --primary: #d3a566; --primary-hover: #e2b87e; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 320px; padding: 24px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    button { border: 0; border-radius: 10px; padding: 10px 18px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <main>
    <img src="/app-icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Catalyst needs an internet connection. Check your Wi-Fi or data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
